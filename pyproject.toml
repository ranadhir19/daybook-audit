[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dayshift"
version = "0.1.0"
description = "A consistency audit for department agent fleets: which commitments contradicted the company's own facts, what the handoffs lost, and what fell on the floor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["dayshift"]
